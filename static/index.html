<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>SkyPulse Weather</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: radial-gradient(circle at 80% 10%, rgba(251, 191, 36, 0.22), transparent 45%), linear-gradient(160deg, #0b132b 0%, #1c2541 50%, #0f172a 100%);
      --glass: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding: 16px 14px 48px;
      transition: background 0.5s ease;
    }
    .container { max-width: 660px; margin: 0 auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .btn {
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 13px;
      padding: 9px 13px;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(59, 130, 246, 0.28); border-color: rgba(96, 165, 250, 0.55); transform: translateY(-1px); }
    .btn:active { transform: scale(0.97); }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 5px;
      border-radius: 16px;
      margin-bottom: 14px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 9px;
      border-radius: 12px;
      font: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active { background: rgba(59, 130, 246, 0.30); color: #fff; }
    .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .input {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 14px;
      color: #fff;
      font: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .input:focus { border-color: #60a5fa; box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.25); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .chip {
      flex: 1;
      min-width: 72px;
      text-align: center;
      padding: 7px 10px;
      font-size: 0.82rem;
      border-radius: 12px;
    }
    .hero {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .city-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
    .city-sub { font-size: 0.92rem; color: #cbd5e1; margin-top: 3px; }
    .hero-icon { font-size: 3.6rem; line-height: 1; }
    .hero-temp {
      font-size: 3.9rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      margin: 14px 0 6px;
      background: linear-gradient(180deg, #fff 25%, #bae6fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-feels { font-size: 0.88rem; color: #cbd5e1; }
    .banner {
      border-radius: 15px;
      padding: 12px 15px;
      margin: 8px 0;
      font-size: 0.92rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .b-ok { background: rgba(34, 197, 94, 0.14); border: 1px solid rgba(34, 197, 94, 0.35); color: #bbf7d0; }
    .b-warn { background: rgba(56, 189, 248, 0.16); border: 1px solid rgba(56, 189, 248, 0.4); color: #bae6fd; }
    .b-alert { background: rgba(239, 68, 68, 0.16); border: 1px solid rgba(239, 68, 68, 0.42); color: #fecaca; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 12px 0;
    }
    @media (min-width: 520px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .tile {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 13px 14px;
    }
    .tile-lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
    .tile-val { font-size: 1.2rem; font-weight: 700; margin-top: 4px; }
    .bar-bg { height: 5px; background: rgba(255, 255, 255, 0.1); border-radius: 99px; margin-top: 8px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; }
    .section-hdr { font-size: 0.95rem; font-weight: 700; color: #e2e8f0; margin: 18px 0 9px; }
    .strip { display: flex; gap: 9px; overflow-x: auto; padding-bottom: 6px; }
    .pill-card {
      flex: 1;
      min-width: 84px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 8px;
      text-align: center;
    }
    .chart-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 18px;
      padding: 12px;
      margin-top: 10px;
    }
    .cmp-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .tag {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      font-size: 0.78rem;
      font-weight: 600;
      margin: 6px 6px 0 0;
    }
    .hidden { display: none !important; }
    .loader { text-align: center; padding: 28px; color: #93c5fd; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">🌤️ SkyPulse Weather</div>
      <div class="top-actions">
        <button id="unitBtn" class="btn" title="Switch Celsius / Fahrenheit">°C ⇄ °F</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="single">📍 Forecast</button>
      <button class="tab-btn" data-tab="compare">🌍 Compare (Max 5)</button>
    </div>

    <div id="tab-single">
      <div class="search-row">
        <input id="cityInput" class="input" type="text" value="Pune" placeholder="Search city (e.g. Pune, Tokyo)..." />
        <button id="searchBtn" class="btn">🔎</button>
        <button id="gpsBtn" class="btn">📍 GPS</button>
      </div>
      <div id="chipsContainer" class="chips"></div>
      <div id="singleOutput"></div>
    </div>

    <div id="tab-compare" class="hidden">
      <div class="search-row">
        <input id="compareInput" class="input" type="text" value="Pune, Mumbai, Delhi, London, Tokyo" placeholder="Up to 5 cities separated by commas..." />
        <button id="compareBtn" class="btn">✨ Compare</button>
      </div>
      <div id="compareOutput"></div>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }

    const THEMES = {
      sun: "radial-gradient(circle at 80% 10%, rgba(251, 191, 36, 0.22), transparent 45%), linear-gradient(160deg, #0b132b 0%, #1c2541 50%, #0f172a 100%)",
      partly: "radial-gradient(circle at 80% 10%, rgba(56, 189, 248, 0.22), transparent 45%), linear-gradient(160deg, #0f172a 0%, #1e293b 55%, #0b1120 100%)",
      cloud: "radial-gradient(circle at 70% 10%, rgba(148, 163, 184, 0.20), transparent 50%), linear-gradient(160deg, #111827 0%, #1f2937 55%, #0f172a 100%)",
      rain: "radial-gradient(circle at 75% 15%, rgba(14, 165, 233, 0.25), transparent 50%), linear-gradient(160deg, #090d16 0%, #172554 55%, #0f172a 100%)",
      storm: "radial-gradient(circle at 75% 15%, rgba(168, 85, 247, 0.25), transparent 50%), linear-gradient(160deg, #09090b 0%, #1e1b4b 55%, #0f172a 100%)",
      fog: "radial-gradient(circle at 50% 10%, rgba(203, 213, 225, 0.18), transparent 55%), linear-gradient(160deg, #1e293b 0%, #334155 55%, #0f172a 100%)",
      snow: "radial-gradient(circle at 80% 10%, rgba(186, 230, 253, 0.25), transparent 50%), linear-gradient(160deg, #0c4a6e 0%, #1e293b 55%, #0f172a 100%)"
    };

    let unit = localStorage.getItem("sp_unit") || "C";
    let recentCities = JSON.parse(localStorage.getItem("sp_recent") || '["Pune","Mumbai","Delhi","London","Tokyo"]');
    let lastSingle = null;
    let lastCompare = null;

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtT = (c) => {
      const v = unit === "F" ? Math.round(((c * 9 / 5) + 32) * 10) / 10 : Math.round(c * 10) / 10;
      return `${v}°${unit}`;
    };
    const fmtShortT = (c) => Math.round(unit === "F" ? (c * 9 / 5) + 32 : c) + "°";

    function aqiMeta(aqi) {
      if (aqi == null) return ["N/A", "#94a3b8"];
      if (aqi <= 50) return [`${aqi} • Good`, "#22c55e"];
      if (aqi <= 100) return [`${aqi} • Moderate`, "#eab308"];
      if (aqi <= 150) return [`${aqi} • Sensitive`, "#f97316"];
      if (aqi <= 200) return [`${aqi} • Unhealthy`, "#ef4444"];
      return [`${aqi} • Hazardous`, "#a855f7"];
    }

    function renderChips() {
      const box = document.getElementById("chipsContainer");
      box.innerHTML = recentCities.slice(0, 5).map(
        (c) => `<button class="btn chip" onclick="loadCity('${esc(c)}')">${esc(c)}</button>`
      ).join("");
    }

    function saveRecent(name) {
      recentCities = [name, ...recentCities.filter((c) => c.toLowerCase() !== name.toLowerCase())].slice(0, 5);
      localStorage.setItem("sp_recent", JSON.stringify(recentCities));
      renderChips();
    }

    function renderSparkline(hourly) {
      if (!hourly || hourly.length < 2) return "";
      const w = 560, h = 110, pad = 22;
      const vals = hourly.map((x) => unit === "F" ? (x.temp * 9 / 5) + 32 : x.temp);
      const minV = Math.min(...vals) - 1, maxV = Math.max(...vals) + 1;
      const pts = vals.map((v, i) => {
        const x = pad + (i * (w - pad * 2)) / (vals.length - 1);
        const y = h - pad - ((v - minV) / (maxV - minV || 1)) * (h - pad * 2);
        return [x, y, Math.round(v)];
      });
      const linePath = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
      const dots = pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fde68a"/><text x="${p[0]}" y="${p[1] - 9}" fill="#e2e8f0" font-size="11" font-weight="700" text-anchor="middle">${p[2]}°</text>`).join("");
      return `<div class="chart-box"><svg viewBox="0 0 ${w} ${h}" width="100%" height="110"><path d="${linePath}" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>${dots}</svg></div>`;
    }

    function renderSingle(w) {
      lastSingle = w;
      document.body.style.background = THEMES[w.art_key] || THEMES.partly;
      const [aqiTxt, aqiCol] = aqiMeta(w.aqi);
      const uvTxt = w.uv != null ? w.uv : "N/A";
      const umbCls = (w.umbrella.includes("Carry") || w.umbrella.includes("small")) ? "b-warn" : "b-ok";
      const cacheBanner = w.from_cache ? `<div class="banner b-warn">📶 Offline cache (${esc(w.cached_at)})</div>` : "";
      const srcNote = w.source ? `<div style="font-size:0.78rem; color:#93c5fd; margin-bottom:6px;">${esc(w.source)}</div>` : "";
      const alertsHtml = (w.alerts || []).map((a) => `<div class="banner b-alert">🚨 ${esc(a)}</div>`).join("");

      const hourlyHtml = (w.hourly || []).length ? `
        <div class="section-hdr">🕒 Upcoming Hours</div>
        <div class="strip">${w.hourly.map((h) => `
          <div class="pill-card">
            <div style="font-size:0.76rem; color:#94a3b8; font-weight:600;">${esc(h.time)}</div>
            <div style="font-size:1.5rem; margin:5px 0;">${esc(h.icon)}</div>
            <div style="font-size:1.05rem; font-weight:700;">${fmtShortT(h.temp)}</div>
            <div style="font-size:0.75rem; color:#38bdf8; font-weight:600; margin-top:2px;">💧 ${h.rain}%</div>
          </div>`).join("")}
        </div>
        ${renderSparkline(w.hourly)}` : "";

      const dailyHtml = (w.daily || []).length ? `
        <div class="section-hdr">📅 5-Day Forecast</div>
        <div class="strip">${w.daily.map((d) => `
          <div class="pill-card" style="min-width:104px;">
            <div style="font-size:0.76rem; color:#94a3b8; font-weight:600;">${esc(d.day)} • ${esc(d.date)}</div>
            <div style="font-size:1.5rem; margin:5px 0;">${esc(d.icon)}</div>
            <div style="font-size:0.98rem; font-weight:700;">${fmtShortT(d.temp_max)} <span style="color:#94a3b8; font-size:0.82rem;">/ ${fmtShortT(d.temp_min)}</span></div>
            <div style="font-size:0.75rem; color:#38bdf8; font-weight:600; margin-top:2px;">💧 ${d.rain_prob}%</div>
          </div>`).join("")}
        </div>` : "";

      document.getElementById("singleOutput").innerHTML = `
        ${cacheBanner}${srcNote}
        <div class="hero">
          <div class="hero-top">
            <div>
              <div class="city-title">📍 ${esc(w.name)}${w.country ? ", " + esc(w.country) : ""}</div>
              <div class="city-sub">${esc(w.condition)}</div>
            </div>
            <div class="hero-icon">${esc(w.icon)}</div>
          </div>
          <div class="hero-temp">${fmtT(w.temp)}</div>
          <div class="hero-feels">Feels like ${fmtT(w.feels_like)} • 🌅 ${esc(w.sunrise)} • 🌇 ${esc(w.sunset)}</div>
        </div>
        <div class="banner ${umbCls}">${esc(w.umbrella)}</div>
        ${alertsHtml}
        <div class="grid">
          <div class="tile"><div class="tile-lbl">💧 Humidity</div><div class="tile-val">${w.humidity}%</div><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100, w.humidity)}%; background:#38bdf8;"></div></div></div>
          <div class="tile"><div class="tile-lbl">🌧️ Rain Chance</div><div class="tile-val">${w.rain_prob}%</div><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100, w.rain_prob)}%; background:#60a5fa;"></div></div></div>
          <div class="tile"><div class="tile-lbl">💨 Wind</div><div class="tile-val">${w.wind} <span style="font-size:0.82rem; color:#94a3b8;">km/h</span></div></div>
          <div class="tile"><div class="tile-lbl">😷 Air Quality</div><div class="tile-val" style="font-size:1.02rem; color:${aqiCol};">${esc(aqiTxt)}</div></div>
          <div class="tile"><div class="tile-lbl">☀️ UV Index</div><div class="tile-val">${uvTxt}</div></div>
          <div class="tile"><div class="tile-lbl">🌅 Sun Cycle</div><div class="tile-val" style="font-size:0.88rem; line-height:1.4;">↑ ${esc(w.sunrise)}<br/>↓ ${esc(w.sunset)}</div></div>
        </div>
        ${hourlyHtml}
        ${dailyHtml}
      `;
    }

    async function loadCity(city) {
      document.getElementById("cityInput").value = city;
      document.getElementById("singleOutput").innerHTML = `<div class="loader">Loading ${esc(city)}...</div>`;
      try {
        const res = await fetch(`/api/weather?city=${encodeURIComponent(city)}`);
        const data = await res.json();
        if (!res.ok) {
          document.getElementById("singleOutput").innerHTML = `<div class="banner b-alert">❌ ${esc(data.error || "Error loading weather")}</div>`;
          return;
        }
        saveRecent(data.name);
        renderSingle(data);
      } catch {
        document.getElementById("singleOutput").innerHTML = `<div class="banner b-alert">❌ Network error connecting to weather server.</div>`;
      }
    }

    async function loadGPS() {
      const out = document.getElementById("singleOutput");
      out.innerHTML = `<div class="loader">📡 Detecting GPS location...</div>`;
      const fallbackIP = async () => {
        try {
          const r = await fetch("/api/auto-location");
          const d = await r.json();
          if (!r.ok) { out.innerHTML = `<div class="banner b-alert">❌ ${esc(d.error)}</div>`; return; }
          d.source = "🌐 Auto-Detected (IP)";
          document.getElementById("cityInput").value = d.name;
          saveRecent(d.name);
          renderSingle(d);
        } catch {
          out.innerHTML = `<div class="banner b-alert">❌ Could not auto-detect location.</div>`;
        }
      };

      if (!navigator.geolocation) return fallbackIP();
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          try {
            const r = await fetch(`/api/weather?lat=${pos.coords.latitude.toFixed(4)}&lon=${pos.coords.longitude.toFixed(4)}`);
            const d = await r.json();
            if (!r.ok) return fallbackIP();
            d.source = "📡 Exact Browser GPS";
            document.getElementById("cityInput").value = d.name;
            saveRecent(d.name);
            renderSingle(d);
          } catch { fallbackIP(); }
        },
        fallbackIP,
        { enableHighAccuracy: false, timeout: 6000, maximumAge: 300000 }
      );
    }

    function renderCompare(data) {
      lastCompare = data;
      const items = data.results || [];
      if (!items.length) {
        document.getElementById("compareOutput").innerHTML = `<div class="banner b-alert">❌ No matching cities found.</div>`;
        return;
      }
      const warm = items.reduce((a, b) => (b.temp > a.temp ? b : a));
      const cool = items.reduce((a, b) => (b.temp < a.temp ? b : a));
      const humid = items.reduce((a, b) => (b.humidity > a.humidity ? b : a));
      const missingHtml = (data.missing || []).map((m) => `<div class="banner b-warn">⚠️ '${esc(m)}' not found (skipped)</div>`).join("");

      document.getElementById("compareOutput").innerHTML = `
        ${missingHtml}
        <div class="grid">
          <div class="tile"><div class="tile-lbl">🔥 Warmest</div><div class="tile-val" style="color:#fbbf24;">${esc(warm.name)}</div><div style="font-size:0.85rem; color:#cbd5e1;">${fmtT(warm.temp)}</div></div>
          <div class="tile"><div class="tile-lbl">❄️ Coolest</div><div class="tile-val" style="color:#38bdf8;">${esc(cool.name)}</div><div style="font-size:0.85rem; color:#cbd5e1;">${fmtT(cool.temp)}</div></div>
          <div class="tile"><div class="tile-lbl">💧 Most Humid</div><div class="tile-val" style="color:#60a5fa;">${esc(humid.name)}</div><div style="font-size:0.85rem; color:#cbd5e1;">${humid.humidity}%</div></div>
        </div>
        ${items.map((w) => {
          const [aqiTxt, aqiCol] = aqiMeta(w.aqi);
          const alertsHtml = (w.alerts || []).map((a) => `<div style="color:#fca5a5; font-size:0.82rem; margin-top:4px;">🚨 ${esc(a)}</div>`).join("");
          return `<div class="cmp-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-size:1.1rem; font-weight:700;">${esc(w.icon)} ${esc(w.name)} <span style="font-size:0.82rem; color:#94a3b8; font-weight:500;">${esc(w.country)}</span></div>
                <div style="font-size:0.84rem; color:#cbd5e1; margin-top:2px;">${esc(w.condition)} • ${esc(w.umbrella)}</div>
              </div>
              <div style="font-size:1.65rem; font-weight:800;">${fmtT(w.temp)}</div>
            </div>
            <div>
              <span class="tag">💧 ${w.humidity}%</span>
              <span class="tag">🌧️ ${w.rain_prob}%</span>
              <span class="tag" style="color:${aqiCol};">😷 AQI ${esc(aqiTxt)}</span>
              <span class="tag">🌅 ${esc(w.sunrise)}</span>
              <span class="tag">🌇 ${esc(w.sunset)}</span>
            </div>
            ${alertsHtml}
          </div>`;
        }).join("")}
      `;
    }

    async function loadCompare() {
      const raw = document.getElementById("compareInput").value;
      document.getElementById("compareOutput").innerHTML = `<div class="loader">⚡ Fetching cities in parallel...</div>`;
      try {
        const res = await fetch(`/api/compare?cities=${encodeURIComponent(raw)}`);
        const data = await res.json();
        if (!res.ok) {
          document.getElementById("compareOutput").innerHTML = `<div class="banner b-alert">❌ ${esc(data.error)}</div>`;
          return;
        }
        renderCompare(data);
      } catch {
        document.getElementById("compareOutput").innerHTML = `<div class="banner b-alert">❌ Network error comparing cities.</div>`;
      }
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const isSingle = btn.dataset.tab === "single";
        document.getElementById("tab-single").classList.toggle("hidden", !isSingle);
        document.getElementById("tab-compare").classList.toggle("hidden", isSingle);
        if (!isSingle && !lastCompare) loadCompare();
      });
    });

    document.getElementById("unitBtn").addEventListener("click", () => {
      unit = unit === "C" ? "F" : "C";
      localStorage.setItem("sp_unit", unit);
      document.getElementById("unitBtn").textContent = unit === "C" ? "°C ⇄ °F" : "°F ⇄ °C";
      if (lastSingle) renderSingle(lastSingle);
      if (lastCompare) renderCompare(lastCompare);
    });
    document.getElementById("unitBtn").textContent = unit === "C" ? "°C ⇄ °F" : "°F ⇄ °C";

    document.getElementById("searchBtn").addEventListener("click", () => {
      const val = document.getElementById("cityInput").value.trim();
      if (val) loadCity(val);
    });
    document.getElementById("cityInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const val = e.target.value.trim();
        if (val) loadCity(val);
      }
    });
    document.getElementById("gpsBtn").addEventListener("click", loadGPS);
    document.getElementById("compareBtn").addEventListener("click", loadCompare);

    renderChips();
    loadCity(recentCities[0] || "Pune");
  </script>
</body>
</html>
